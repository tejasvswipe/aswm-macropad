; Tejas Macropad - ESP32-S3 (native USB HID + CDC)
[env:macropad]
; pioarduino = Arduino-ESP32 core 3.x (needed for USBHIDConsumerControl)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; PSRAM is not used. Works for N4/N8/N16 modules.
board_build.arduino.memory_type = qio_qspi
build_flags =
  -DARDUINO_USB_MODE=0          ; TinyUSB (needed for HID)
  -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = USB CDC (host companion talks here)
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  adafruit/Adafruit GFX Library @ ^1.11.9
  adafruit/Adafruit SSD1306 @ ^2.5.9
  adafruit/Adafruit NeoPixel @ ^1.12.0
